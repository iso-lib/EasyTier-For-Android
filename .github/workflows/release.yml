name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name (e.g., 1.0.1)'
        required: true
        type: string
      release_notes:
        description: 'Release notes'
        required: false
        type: string
        default: 'New release'
      easytier_version:
        description: 'EasyTier source version (git tag, branch, or commit, e.g. v2.6.3, main)'
        required: false
        type: string
        default: 'main'
      update_proto:
        description: 'Update proto files from EasyTier source (true/false)'
        required: false
        type: boolean
        default: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      # ====== EasyTier Native Library Build ======

      - name: Checkout EasyTier Source
        uses: actions/checkout@v4
        with:
          repository: EasyTier/EasyTier
          ref: ${{ inputs.easytier_version }}
          path: easytier-source

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Version Info
        run: |
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Cache Rust Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('easytier-source/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Rust Build Target
        uses: actions/cache@v4
        with:
          path: easytier-source/target
          key: ${{ runner.os }}-rust-target-arm64-${{ inputs.easytier_version }}-${{ hashFiles('easytier-source/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-target-arm64-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        id: setup-ndk
        run: |
          set -e
          ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          # List available NDK installations
          echo "=== Available NDK installations ==="
          ls -la "$ANDROID_SDK_ROOT/ndk/" 2>/dev/null || echo "No NDK directory found"

          # Try to find existing NDK installation (prefer latest)
          NDK_PATH=$(ls -d "$ANDROID_SDK_ROOT/ndk/"* 2>/dev/null | sort -V | tail -1)
          if [ -n "$NDK_PATH" ] && [ -d "$NDK_PATH" ]; then
            echo "Found existing NDK: $NDK_PATH"
          else
            echo "No NDK found, installing NDK 27..."
            # Find sdkmanager
            SDKMANAGER=""
            for candidate in \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" \
              "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
            if [ -z "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager not found!"
              echo "Listing SDK contents:"
              find "$ANDROID_SDK_ROOT" -name "sdkmanager" 2>/dev/null || true
              exit 1
            fi
            echo "Using sdkmanager: $SDKMANAGER"
            echo "y" | "$SDKMANAGER" "ndk;27.0.12077973"
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
            if [ ! -d "$NDK_PATH" ]; then
              echo "ERROR: NDK installation failed, $NDK_PATH does not exist"
              exit 1
            fi
          fi

          # Verify NDK
          echo "=== NDK verification ==="
          echo "NDK path: $NDK_PATH"
          ls "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android"* 2>/dev/null | head -3 || echo "Warning: aarch64 toolchain not found in expected location"

          # Set environment variables for cargo-ndk
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "Using NDK: $NDK_PATH"

      - name: Install Protoc and Rust Target
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install Rust Target for EasyTier Toolchain
        working-directory: easytier-source
        run: |
          # EasyTier has rust-toolchain.toml specifying channel "1.95"
          # We need to install the android target for that specific toolchain
          rustup target add aarch64-linux-android --toolchain 1.95-x86_64-unknown-linux-gnu
          rustup target list --installed --toolchain 1.95-x86_64-unknown-linux-gnu
          # Also ensure stable toolchain has it
          rustup target add aarch64-linux-android

      - name: Build EasyTier FFI Library
        working-directory: easytier-source
        run: |
          set -e
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          cargo ndk --version
          cargo ndk -t arm64-v8a build --release -p easytier-ffi

      - name: Build EasyTier Android JNI Library
        working-directory: easytier-source
        run: |
          set -e
          cargo ndk -t arm64-v8a build --release -p easytier-android-jni

      - name: Strip and Copy Native Libraries to jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}"
          STRIP="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ -x "$STRIP" ]; then
            echo "Stripping with llvm-strip..."
            echo "  Before:"
            ls -lh easytier-source/target/aarch64-linux-android/release/libeasytier_*.so
            cp easytier-source/target/aarch64-linux-android/release/libeasytier_android_jni.so app/src/main/jniLibs/arm64-v8a/
            cp easytier-source/target/aarch64-linux-android/release/libeasytier_ffi.so app/src/main/jniLibs/arm64-v8a/
            "$STRIP" --strip-debug app/src/main/jniLibs/arm64-v8a/libeasytier_android_jni.so
            "$STRIP" --strip-debug app/src/main/jniLibs/arm64-v8a/libeasytier_ffi.so
            echo "  After strip:"
            ls -lh app/src/main/jniLibs/arm64-v8a/
          else
            echo "llvm-strip not found, copying without stripping"
            cp easytier-source/target/aarch64-linux-android/release/libeasytier_android_jni.so app/src/main/jniLibs/arm64-v8a/
            cp easytier-source/target/aarch64-linux-android/release/libeasytier_ffi.so app/src/main/jniLibs/arm64-v8a/
            ls -lh app/src/main/jniLibs/arm64-v8a/
          fi

      - name: Update Proto Files
        if: ${{ inputs.update_proto }}
        run: |
          # Remove old proto files (keep subdirectories)
          find app/src/main/proto -maxdepth 1 -name "*.proto" -delete
          find app/src/main/proto -maxdepth 1 -name "*.rs" -delete
          # Copy new proto files from EasyTier source
          cp easytier-source/easytier/src/proto/*.proto app/src/main/proto/
          # Copy subdirectories
          if [ -d "easytier-source/easytier/src/proto/rpc_impl" ]; then
            rm -rf app/src/main/proto/rpc_impl
            cp -r easytier-source/easytier/src/proto/rpc_impl app/src/main/proto/
          fi
          if [ -d "easytier-source/easytier/src/proto/rpc_types" ]; then
            rm -rf app/src/main/proto/rpc_types
            cp -r easytier-source/easytier/src/proto/rpc_types app/src/main/proto/
          fi
          echo "Updated proto files:"
          ls -la app/src/main/proto/

      # ====== Android Build ======

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create gradle.properties
        run: |
           echo "android.useAndroidX=true" >> gradle.properties
           echo "android.nonTransitiveRClass=false" >> gradle.properties
           echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
           echo "org.gradle.daemon=true" >> gradle.properties
           echo "org.gradle.parallel=true" >> gradle.properties
           echo "org.gradle.configureondemand=true" >> gradle.properties

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MY_KEY_PASSWORD }}
        run: |
          echo "$ENCODED_STRING" | base64 --decode > app/keystore.jks
          echo "" >> gradle.properties
          echo "MY_KEYSTORE_FILE=keystore.jks" >> gradle.properties
          echo "MY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> gradle.properties
          echo "MY_KEY_ALIAS=$KEY_ALIAS" >> gradle.properties
          echo "MY_KEY_PASSWORD=$KEY_PASSWORD" >> gradle.properties

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"

      - name: Rename APKs
        id: apk-path
        run: |
          cd app/build/outputs/apk/release/
          for f in app-*-release.apk; do
            abi="${f#app-}"
            abi="${abi%-release.apk}"
            mv "$f" "easytier-${abi}.apk"
          done
          echo "apk_path=app/build/outputs/apk/release/*.apk" >> $GITHUB_OUTPUT

      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ inputs.version_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally, deleting..."
            git tag -d "$TAG"
          fi
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote, deleting..."
            git push --delete origin "$TAG"
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version_name }}
          name: Release v${{ inputs.version_name }}
          body: ${{ inputs.release_notes }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
